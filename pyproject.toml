[project]
name = "model123d"
version = "0.1.0"
description = ""
authors = [
    {name = "Andreas **Felix** Häberle",email = "felix@42sol.eu"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d>=0.9.1,<0.10.0",
    "ocp-vscode>=2.7.1,<3.0.0",
    "rich>=14.1.0,<15.0.0",
    "lib3mf>=2.4.1,<3.0.0",
    "pillow>=11.3.0,<12.0.0",
    "pydantic>=2.11.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=25.1.0,<26.0.0",
]
docs = [
    "mkdocs>=1.6.0,<2.0.0",
    "mkdocs-material>=9.5.0,<10.0.0",
    "mkdocstrings>=0.24.0,<1.0.0",
    "mkdocstrings-python>=1.8.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model123d"]
